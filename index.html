function overview(){const all=Object.keys(TYPES).flatMap(k=>db[k]),publishedCount=all.filter(r=>r.live).length,review=all.filter(r=>r.status==='in-review'),draft=all.filter(r=>r.status==='draft');const canReview=review.filter(r=>allowed(Object.keys(TYPES).find(t=>db[t].includes(r)),'publish'));return `${intro('An easier way to manage AI at LukeU','Update structured content once. Publish it through the same source to the public experience.',`<button class="btn" onclick="setMode('public')">Open public experience ↗</button>`)}<div class="notice"><b>Demonstration mode:</b> You can impersonate every role using the selector above. Drafts stay private until published. Changes are stored in this browser—not on a real server.</div><section class="stats"><div class="card stat"><div class="stat-label">Live records</div><div class="stat-val">${publishedCount}</div><div class="stat-note">Across 8 content collections</div></div><div class="card stat"><div class="stat-label">Awaiting approval</div><div class="stat-val">${review.length}</div><div class="stat-note">${canReview.length} you can publish in this role</div></div><div class="card stat"><div class="stat-label">Drafts / revisions</div><div class="stat-val">${draft.length}</div><div class="stat-note">Not yet in the experience</div></div><div class="card stat"><div class="stat-label">User requests</div><div class="stat-val">${db.requests.length}</div><div class="stat-note">${db.requests.filter(r=>r.status==='new').length} new requests to triage</div></div></section><div class="dashboard-grid"><div class="card pad"><div class="section-head"><h2>Approval queue</h2><button class="btn sm" onclick="setPage('interpretations')">Manage guidance</button></div>${review.length?`<div class="queue">${review.slice(0,6).map(r=>{let type=Object.keys(TYPES).find(t=>db[t].includes(r));return `<div class="queue-item"><div><strong>${e(r.title)}</strong><span>${e(displayType(type))} · Submitted for review</span></div><button class="btn sm" onclick="openEditor('${type}','${r.id}')">Review →</button></div>`}).join('')}</div>`:`<div class="empty"><b>Nothing waiting for approval</b><span>Try editing a published interpretation as a contributor and submitting it.</span></div>`}</div><div class="card pad"><h2>How the publishing model works</h2><p class="muted small">Each content type has dedicated editors and publication authority.</p><div class="flowsteps"><div><b>1. Create</b><span>Complete a simple form</span></div><div><b>2. Review</b><span>Submit to an approver</span></div><div><b>3. Publish</b><span>Update the public experience</span></div></div><div style="margin-top:19px" class="acl-note"><b>Your role: ${e(ROLES[role])}</b><br>${e(roleDescription(role))}</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:17px"><button class="btn sm" onclick="setPage('roles')">See permissions</button><button class="btn sm" onclick="resetDemo()">Reset demo data</button><button class="btn sm" onclick="exportDemo()">Export JSON</button></div></div></div><div class="secondary-panel card pad"><div class="section-head"><h2>One source, connected experiences</h2></div><div class="flowsteps"><div><b>Source records</b><span>Policies, interpretations, tools, events and learning</span></div><div><b>Editorial controls</b><span>Scoped roles, review, approval, publishing</span></div><div><b>Public delivery</b><span>Context-based guidance, tool results and filtered calendar</span></div></div></div><div class="footer-note">Fictional demonstration. Client-side permission checks are illustrative only, not secure authentication or authorization.</div>`}

function renderRows(type){const arr=db[type].filter(r=>(r.title+' '+(r.summary||r.answer||'')+' '+r.id).toLowerCase().includes(filters.search.toLowerCase())&&(filters.status==='all'||r.status===filters.status));if(!arr.length)return `<div class="empty"><b>No matching records</b><span>Try different search terms or status filters.</span></div>`;return arr.map(r=>`<div class="record-row"><div><div class="record-title">${e(r.title)}</div><div class="record-meta">${e(r.id)} · ${e(r.owner||'LukeU')} ${r.live&&r.status!=='published'?' · Published version still active':''}</div></div><div>${recordBadge(r)}</div><div class="record-meta updated">${niceDate(r.updated)}</div><button class="chev" aria-label="Open ${e(r.title)}" onclick="openEditor('${type}','${r.id}')">→</button></div>`).join('')}

function filteredEvents(kind){return db.events.filter(r=>(kind==='public'?r.live:true)).map(r=>({...r,...(kind==='public'?r.live:r)})).filter(r=>(filters.eventType==='all'||r.eventType===filters.eventType)&&(filters.audience==='all'||(r.contexts||[]).includes(filters.audience)))}
function calendar(kind){const d=new Date(calendarDate.getFullYear(),calendarDate.getMonth(),1),yr=d.getFullYear(),mo=d.getMonth(),first=d.getDay(),len=new Date(yr,mo+1,0).getDate(),prevLen=new Date(yr,mo,0).getDate(),events=filteredEvents(kind),todayLocal=dateStr(new Date());const cells=Array.from({length:42},(_,i)=>{let day=i-first+1;let date=new Date(yr,mo,day);let key=dateStr(date);let thisMonth=day>=1&&day<=len;let ev=events.filter(x=>x.date===key);return `<div class="cal-day ${thisMonth?'':'dim'} ${key===todayLocal?'today':''}"><div class="cal-num">${date.getDate()}</div>${ev.slice(0,2).map(x=>`<button class="cal-event" title="${e(x.title)}" onclick="${kind==='studio'?`openEditor('events','${x.id}')`:`showPublicDetail('events','${x.id}')`}">${e(x.time||'')} ${e(x.title)}</button>`).join('')}${ev.length>2?`<span class="tiny muted">+${ev.length-2} more</span>`:''}</div>`}).join('');const upcoming=events.filter(x=>x.date>=todayLocal).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);return `<div class="calendar-layout"><div class="card pad"><div class="calendar-toolbar"><h2>${d.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</h2><div class="actions"><button class="btn sm" aria-label="Previous month" onclick="moveMonth(-1)">←</button><button class="btn sm" aria-label="Next month" onclick="moveMonth(1)">→</button></div></div><div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-day-head">${x}</div>`).join('')}${cells}</div></div><div class="card pad"><h2>Upcoming events</h2><p class="small muted">${kind==='public'?'Published events only':'Editors can open drafts and revisions'} · ${events.length} matching</p><div class="event-side">${upcoming.length?upcoming.map(x=>`<div class="event-mini"><div class="eyebrow" style="margin:0 0 5px">${niceDate(x.date)} · ${e(x.time||'')}</div><strong>${e(x.title)}</strong><span>${e(x.eventType||'Event')} · ${e(x.location||'Online')}</span><div style="margin-top:8px"><button class=" function rolesPage(){const names=['policies','interpretations','faculty','tools','events','training','news','communities'];return `${intro('Roles & permissions','Demonstrate who can create, edit, submit, approve and publish content. Switch identity at the top of the page.')}<div class="notice warn"><b>Important:</b> Role switching and permission checks are client-side simulations. A production system must enforce RBAC on the server and scope permissions to records and organizational authority.</div><div class="persona"><div><div class="eyebrow">CURRENT DEMO IDENTITY</div><strong style="font-size:19px">${e(ROLES[role])}</strong><p style="margin:6px 0 0;color:#59617d;font-size:12px">${e(roleDescription(role))}</p></div><button class="btn" onclick="setRole('viewer');setMode('public')">Try visitor experience ↗</button></div><div class="card pad" style="margin-bottom:20px"><h2>Try another role</h2><div class="actions">${Object.entries(ROLES).map(([id,name])=>`<button class="btn sm ${role===id?'primary':''}" onclick="setRole('${id}')">${e(name)}</button>`).join('')}</div></div><div class="section-head"><h2>Rights by content collection</h2><span class="muted small">Displayed for ${e(ROLES[role])}</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Collection</th><th>Create</th><th>Edit draft</th><th>Submit</th><th>Publish</th><th>Comment</th></tr></thead><tbody>${names.map(type=>`<tr><td><b>${e(TYPES[type].label)}</b></td>${['create','edit','edit','publish','comment'].map(action=>`<td><span class="${allowed(type,action)?'allow':'deny'}">${allowed(type,action)?'✓':'—'}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="card pad secondary-panel"><h2>How these roles work together</h2><div class="flowsteps"><div><b>Policy contributor → Owner</b><span>Propose and approve requirements.</span></div><div><b>Interpretation contributor → Approver</b><span>Draft, review and publish controlled answers.</span></div><div><b>Faculty contributor → Approver</b><span>Extend rules within a delegated scope.</span></div></div><p class="small muted" style="margin:14px 0 0">A real deployment also needs permissions by faculty, policy section, tool ownership, content lifecycle state, and separation of duties. This mockup illustrates role capabilities, not institutional authentication.</p></div>`}
function activityPage(){return `${intro('Activity log','A lightweight history of editorial changes made in this demo.',`<button class="btn" onclick="exportDemo()">Export demo data</button>`)}<div class="card list-card">${db.audit.length?db.audit.map(x=>`<div class="record-row" style="grid-template-columns:1fr 170px 125px"><div><b class="record-title">${e(x.action)} · ${e(x.item)}</b><div class="record-meta">${e(x.role)}</div></div><div class="record-meta">${e(x.date)}</div><div><span class="badge">Demo record</span></div></div>`).join(''):`<div class="empty"><b>No changes recorded yet</b><span>Save, submit or publish something to see the trail.</span></div>`}</div><p class="footer-note">This activity log can be edited by anyone with browser access. It is not an immutable audit record.</p>`}
function requestsPage(){const canTriage=['admin','interpretationApprover','contentEditor','toolSteward'].includes(role);return `${intro('Requests inbox','User-submitted questions, suggested updates and problem reports. Requests are stored locally for this prototype.')}<div class="notice">The public experience includes "Ask a question", "Suggest an update", and "Report a conflict". Those requests appear here, with simple triage controls.</div><div class="card list-card">${db.requests.length?db.requests.map(x=>`<div class="record-row" style="grid-template-columns:minmax(0,1fr) 115px 175px 42px"><div><div class="record-title">${e(x.subject)}</div><div class="record-meta">${e(x.type)} · ${e(x.context)} · ${e(x.date)}</div><p class="small muted" style="margin:5px 0 0">${e(x.details)}</p></div><div>${badge(x.status==='new'?'in-review':x.status)}</div><div class="actions">${canTriage?`<button class="btn sm" onclick="resolveRequest('${x.id}')">${x.status==='new'?'Mark triaged':'Reopen'}</button>`:''}${allowed('interpretations','create')?`<button class="btn sm" onclick="startFromRequest('${x.id}')">Draft answer</button>`:''}</div><button class="chev" onclick="showRequest('${x.id}')">→</button></div>`).join(''):`<div class="empty"><b>No requests yet</b><span>Switch to the public experience and submit a question to test this flow.</span><div style="margin-top:15px"><button class="btn primary" onclick="setMode('public');openRequest('Question')">Try request form</button></div></div>`}</div>`}
function resolveRequest(id){if(!['admin','interpretationApprover','contentEditor','toolSteward'].includes(role))return toast('This role cannot triage requests.');const x=db.requests.find(r=>r.id===id);if(x){x.status=x.status==='new'?'triaged':'new';log('Triage request',id);persist();render()}}

function fieldHTML(f,r,canEdit){if(f.h)return `<div class="form-title">${e(f.h)}</div>`;const value=r[f.n]??(f.t==='multi'?[]:'');const disabled=canEdit?'':'disabled';let widget='';if(f.t==='textarea')widget=`<textarea name="${f.n}" ${disabled} ${f.req?'required':''} rows="3">${e(value)}</textarea>`;else if(['text','date','time','url'].includes(f.t))widget=`<input name="${f.n}" type="${f.t}" value="${e(value)}" ${disabled} ${f.req?'required':''}>`;else if(f.t==='select'||f.t==='selectDynamic'){const options=f.t==='selectDynamic'?(db[f.source]||[]).map(x=>({value:x.id,label:`${x.id} · ${x.title}`})):(f.options||[]).map(x=>({value:x,label:x}));widget=`<select name="${f.n}" ${disabled}><option value="">Choose...</option>${options.map(x=>`<option value="${e(x.value)}" ${x.value===value?'selected':''}>${e(x.label)}</option>`).join('')}</select>`}else if(f.t==='multi'||f.t==='multiPolicies'||f.t==='multiTools'){let options=f.t==='multi'?(f.options||[]).map(x=>({value:x,label:x})):(f.t==='multiPolicies'?db.policies:db.tools).map(x=>({value:x.id,label:`${x.title} (${x.id})`}));widget=`<div class="checklist">${options.map(x=>`<label class="check-option"><input name="${f.n}" type="checkbox" value="${e(x.value)}" ${(Array.isArray(value)?value:[]).includes(x.value)?'checked':''} ${disabled}>${e(x.label)}</label>`).join('')}</div>`}return `<div class="field"><label>${e(f.l)} ${f.req?'<span style="color:#ba3947">*</span>':''}</label>${widget}${f.tip?`<div class="hint">${e(f.tip)}</div>`:''}</div>`}
function openEditor(type,id,prefill=null){const isNew=id==='new';if(isNew&&!allowed(type,'create'))return toast('This role cannot create this kind of record.');let r=isNew?Object.assign({title:'',contexts:CONTEXTS.slice(0,1),classifications:['Public'],capabilities:[],policyIds:[],toolIds:[],date:today},prefill||{}):db[type].find(x=>x.id===id);if(!r)return;editing={type,id,isNew};const editAllowed=allowed(type,'edit');const publishAllowed=allowed(type,'publish');const canComment=allowed(type,'comment')&&!isNew;const comments=r.comments||[];document.getElementById('editor').innerHTML=`<div class="drawer-top"><div><div class="eyebrow">${e(TYPES[type].singular)} ${isNew?'· New':`· ${e(r.id)}`}</div><h2>${isNew?'Create new record':e(r.title)}</h2><div class="small muted" style="margin-top:5px">${isNew?'Fill in the form to create a draft':recordBadge(r)}${!isNew?` · Version ${r.version||1}`:''}</div></div><button class="btn sm ghost" aria-label="Close editor" onclick="closeEditor()">✕</button></div><div class="drawer-body"><div class="notice" style="margin-bottom:18px">${isNew?'New content starts as a private draft.':r.live&&r.status!=='published'?'A previously published version remains visible publicly until you publish this revision.':r.status==='published'?'Editing this record creates a draft revision. The live version will not change until publication.':'This draft is not visible in the public experience.'}</div><form id="recordForm" onsubmit="event.preventDefault();saveEditor('draft')">${SCHEMAS[type].map(f=>fieldHTML(f,r,editAllowed)).join('')}</form>${canComment?`<div class="comments"><h3>Discussion and review notes</h3>${comments.length?comments.map(c=>`<div class="comment">${e(c.text)}<small>${e(c.role)} · ${e(c.date)}</small></div>`).join(''):'<p class="small muted">No comments yet.</p>'}<div class="mini-form"><input id="commentText" placeholder="Add a review comment..." maxlength="500"><button class="btn sm" onclick="saveComment('${type}','${r.id}')">Comment</button></div></div>`:''}</div><div class="drawer-foot"><div class="muted tiny">${editAllowed?'Editable in this role':'Read only for this role'}</div><div class="actions">${editAllowed?`<button class="btn sm" onclick="saveEditor('draft')">Save draft</button><button class="btn sm" onclick="saveEditor('review')">Submit for review</button>`:''}${publishAllowed?`<button class="btn primary sm" onclick="saveEditor('publish')">Publish ↗</button>`:''}</div></div>`;document.getElementById('drawerBack').classList.add('open');document.getElementById('editor').classList.add('open');document.getElementById('editor').setAttribute('aria-hidden','false')}
function closeEditor(){editing=null;document.getElementById('drawerBack').classList.remove('open');document.getElementById('editor').classList.remove('open');document.getElementById('editor').setAttribute('aria-hidden','true')}
function collectForm(type){const form=document.getElementById('recordForm');if(!form)return null;let data={};for(const f of SCHEMAS[type]){if(!f.n)continue;if(['multi','multiPolicies','multiTools'].includes(f.t)){data[f.n]=Array.from(form.querySelectorAll(`[name="${f.n}"]:checked`)).map(x=>x.value)}else data[f.n]=form.elements.namedItem(f.n)?.value?.trim()||''}return data}
function nextID(type){const prefix={interpretations:'INT',policies:'POL',faculty:'FAC',tools:'TOOL',events:'EVENT',training:'TRAIN',news:'NEWS',communities:'COM'}[type];const nums=db[type].map(x=>Number(x.id.split('-').pop())||0);return `${prefix}-${String(Math.max(0,...nums)+1).padStart(3,'0')}`}
function validateRecord(type,data,target){if(!data.title)return 'A title or user question is required.';if(type==='interpretations'&&target==='publish'){if(!data.answer)return 'An approved answer is required.';if(!data.policyIds?.length)return 'Link at least one authoritative policy source before publishing.';if(!data.contexts?.length)return 'Select the applicable contexts.';if(!data.task)return 'Select an activity/task.';if(!data.classifications?.length)return 'Select applicable information classifications.';}if(type==='events'&&!data.date)return 'Select an event date.';if(type==='faculty'&&target==='publish'&&!data.interpretationId)return 'Link the local extension to a central interpretation.';if(type==='tools'&&target==='publish'&&!data.toolStatus)return 'Set the tool status before publishing.';return ''}
function saveEditor(target){if(!editing)return;const {type,id,isNew}=editing;const needsEdit=target!=='publish';if(needsEdit&&!allowed(type,'edit'))return toast('This role cannot edit this collection.');if(target==='publish'&&!allowed(type,'publish'))return toast('You do not have publishing authority for this collection.');const data=collectForm(type),error=validateRecord(type,data,target);if(error){toast(error);return}let r=isNew?{id:nextID(type),version:0,live:null,comments:[]}:db[type].find(x=>x.id===id);if(!r)return;Object.assign(r,data);r.updated=today;r.status=target==='publish'?'published':target==='review'?'in-review':'draft';if(target==='publish'){r.version=(r.version||0)+1;r.live=structuredClone(data);r.live.id=r.id;}if(isNew)db[type].unshift(r);log(target==='publish'?'Published':target==='review'?'Submitted for review':'Saved draft',`${r.id} ${r.title}`);persist();closeEditor();render();toast(target==='publish'?`Published: ${r.title}. Public experience updated.`:target==='review'?`Submitted ${r.id} for review. No public changes yet.`:`Draft saved: ${r.id}. Public experience unchanged.`)}
function saveComment(type,id){if(!allowed(type,'comment'))return toast('This role cannot comment here.');const value=document.getElementById('commentText')?.value.trim();if(!value)return toast('Write a comment first.');const r=db[type].find(x=>x.id===id);if(!r)return;r.comments=r.comments||[];r.comments.push({role:ROLES[role],date:new Date().toLocaleString('en-CA'),text:value});log('Added comment',id);persist();openEditor(type,id);toast('Comment added.')}
function resetDemo(){if(!confirm('Reset all edits, requests and published changes back to sample data?'))return;db=structuredClone(seed);persist();render();toast('Restored original demo records.')}

function openMobileNav(){const links=['overview','interpretations','policies','faculty','tools','events','training','news','communities','requests','roles','activity'];document.getElementById('modalContent').innerHTML=`<h2>Navigate Content Studio</h2><div class="stack">${links.map(x=>`<button class="btn" style="justify-content:flex-start" onclick="closeModal();setPage('${x}')">${e(TYPES[x]?.label||x.replace(/^./,c=>c.toUpperCase()))}</button>`).join('')}</div>`;document.getElementById('modalLayer').classList.add('open')}
function renderPublic(){const tabs=[['discover','Get guidance'],['tools','Find tools'],['events','Events'],['training','Learn'],['communities','Connect'],['news','Updates']];return `<div class="public"><section class="public-hero"><div class="public-hero-inner"><div class="eyebrow" style="color:#c3c7ff">LUKEU UNIVERSITY · AI EXPERIENCE · FICTIONAL DEMO</div><h1>Make AI work for you.<br>Know what works here.</h1><p>Find guidance, tools, training and people based on what you want to do—not which office owns the information.</p><div class="tagrow"><span class="chip" style="background:#ffffff17;color:white;border:1px solid #ffffff35">One connected source</span><span class="chip" style="background:#ffffff17;color:white;border:1px solid #ffffff35">Context-based answers</span><span class="chip" style="background:#ffffff17;color:white;border:1px solid #ffffff35">Fictional example content</span></div></div></section><div class="public-inner"><div class="panel"><div class="public-tabs" role="tablist" aria-label="Public experience sections">${tabs.map(([id,label])=>`<button role="tab" aria-selected="${publicTab===id}" class="${publicTab===id?'active':''}" onclick="publicTab='${id}';render()">${label}</button>`).join('')}</div>${publicTab==='discover'?discoverView():publicTab==='tools'?toolsPublic():publicTab==='events'?eventsPublic():publicTab==='training'?trainingPublic():publicTab==='communities'?communitiesPublic():newsPublic()}</div><div class="request-banner"><div><strong>Something missing, confusing or out of date?</strong><div class="muted small">Send a question or flag conflicting guidance. In this demo it enters the local Studio inbox.</div></div><div class="actions"><button class="btn sm" onclick="openRequest('Suggest an update')">Suggest update</button><button class="btn primary sm" onclick="openRequest('Question')">Ask a question →</button></div></div><p class="footer-note"><b>LukeU is fictitious.</b> All policy, entitlement, safety and service claims shown here are demonstration content, not York University policy or formal advice. This prototype does not transmit requests or store data on a real server.</p></div></div>`}
function discoverView(){return `<div class="eyebrow" style="margin-top:7px">GUIDANCE FINDER</div><h2 style="font-size:23px">Tell us what you want to do</h2><p class="muted">Choose your context, task and information type. We'll match them to published guidance records.</p><div class="pub-questions"><div class="choicebox"><h3>1 · I'm here to...</h3><div class="choice">${CONTEXTS.map(x=>`<button class="${publicState.contexts.includes(x)?'active':''}" onclick="togglePublicContext('${x}')">${x}</button>`).join('')}</div><p class="tiny muted" style="margin:10px 0 0">Choose more than one</p></div><div class="choicebox"><h3>2 · I want to...</h3><select class="select" onchange="publicState.task=this.value;render()">${TASKS.map(x=>`<option value="${e(x)}" ${publicState.task===x?'selected':''}>${e(x)}</option>`).join('')}</select></div><div class="choicebox"><h3>3 · I'm using information that is...</h3><select class="select" onchange="publicState.classification=this.value;render()">${[...CLASSIFICATIONS,"I'm not sure"].map(x=>`<option value="${e(x)}" ${publicState.classification===x?'selected':''}>${e(x)}</option>`).join('')}</select><p class="tiny muted" style="margin:9px 0 0">Don't know? Choose “I'm not sure”.</p></div></div><div class="field" style="max-width:330px;margin:0 0 22px"><label for="facultyFilter">Faculty or unit (optional)</label><select id="facultyFilter" onchange="publicState.faculty=this.value;render()"><option value="all">No local context selected</option>${['Faculty of Arts & Design','Faculty of Science','Faculty of Business','University Library'].map(x=>`<option value="${e(x)}" ${publicState.faculty===x?'selected':''}>${e(x)}</option>`).join('')}</select></div>${guidanceView()}`}
function togglePublicContext(context){if(publicState.contexts.includes(context)){if(publicState.contexts.length>1)publicState.contexts=publicState.contexts.filter(x=>x!==context)}else publicState.contexts.push(context);render()}
function matchingGuidance(){if(publicState.classification==="I'm not sure")return null;return db.interpretations.filter(x=>x.live).map(x=>({...x.live,id:x.id,version:x.version})).filter(x=>x.task===publicState.task&&(x.contexts||[]).some(c=>publicState.contexts.includes(c))&&(x.classifications||[]).includes(publicState.classification)).sort((a,b)=>(b.contexts?.length===1?1:0)-(a.contexts?.length===1?1:0))[0]||null}
function guidanceView(){const r=matchingGuidance();if(!r){const unsure=publicState.classification==="I'm not sure";const related=db.interpretations.filter(x=>x.live&&x.live.task===publicState.task).slice(0,3);return `<div class="card pad" style="background:#fafbff;border-color:#dadeef"><div class="eyebrow">${unsure?'MORE CONTEXT NEEDED':'NO EXACT MATCH'}</div><h2>${unsure?'First, confirm your information classification':'No published interpretation exactly matches this combination'}</h2><p class="muted">${unsure?'The system will not assume your information is public. Use the university classification process or ask the relevant data steward before proceeding.':'That does not automatically mean the activity is allowed or prohibited. The catalogue needs a reviewed answer for this situation.'}</p>${related.length?`<div class="small muted" style="margin-bottom:12px">Related published questions:</div><div class="stack">${related.map(x=>`<div class="item-card"><b>${e(x.live.title)}</b><div class="tiny muted">${e((x.live.contexts||[]).join(', '))} · ${e((x.live.classifications||[]).join(', '))}</div></div>`).join('')}</div>`:''}<div class="actions" style="margin-top:17px"><button class="btn primary" onclick="openRequest('Question')">Request a specific answer →</button><button class="btn" onclick="openRequest('Report a conflict')">Report confusing guidance</button></div></div>`}
const tools=(r.toolIds||[]).map(id=>db.tools.find(x=>x.id===id)).filter(x=>x&&x.live).map(x=>({...x.live,id:x.id}));const trainings=db.training.filter(x=>x.live&&x.live.task===publicState.task&&(x.live.contexts||[]).some(c=>publicState.contexts.includes(c))).slice(0,2);const nextEvent=db.events.filter(x=>x.live&&x.live.date>=today&&(x.live.contexts||[]).some(c=>publicState.contexts.includes(c))).sort((a,b)=>a.live.date.localeCompare(b.live.date))[0];const policies=(r.policyIds||[]).map(id=>db.policies.find(x=>x.id===id)).filter(x=>x&&x.live);const overlays=db.faculty.filter(x=>x.live&&x.live.interpretationId===r.id&&(publicState.faculty||'all')!=='all'&&x.live.faculty===publicState.faculty).map(x=>x.live);return `<div class="guidance-grid"><div class="card pad" style="box-shadow:none"><div class="guidance-head"><div><div class="eyebrow">PUBLISHED GUIDANCE · ${e(r.id)} · VERSION ${e(r.version)}</div><h2>${e(r.title)}</h2></div><span class="badge ${r.decision?.startsWith('Not')?'red':r.decision?.includes('Conditions')||r.decision?.includes('review')?'amber':'green'}">${e(r.decision)}</span></div><p style="font-size:14px;line-height:1.65">${e(r.answer)}</p>${r.acceptable?`<div class="guidance-part"><h3 style="color:#147650">✓ Generally acceptable</h3><p>${e(r.acceptable)}</p></div>`:''}${r.conditions?`<div class="guidance-part"><h3 style="color:#975e00">◇ Conditions before use</h3><p>${e(r.conditions)}</p></div>`:''}${r.prohibited?`<div class="guidance-part"><h3 style="color:#ad3948">⊘ Not acceptable</h3><p>${e(r.prohibited)}</p></div>`:''}${overlays.map(x=>`<div class="guidance-part" style="background:#f6f6ff;padding:14px;border:1px solid #dddffd;border-radius:10px"><h3>▧ Local requirement · ${e(x.faculty)}</h3><p>${e(x.conditions||x.summary)}</p><div class="small muted" style="margin-top:9px">What happens if it is breached: ${e(x.consequences||'Consult local procedures.')}</div></div>`).join('')}<div class="guidance-part"><h3>Authoritative basis (fictional)</h3><div class="tagrow">${policies.map(x=>`<span class="chip">${e(x.live.title)} · ${e(x.id)}</span>`).join('')}</div><div class="small muted" style="margin-top:11px">Guidance steward: ${e(r.owner||'Institutional AI Guidance')}. This answer is a demo record, not institutional advice.</div></div></div><aside class="stack"><div class="card pad" style="box-shadow:none"><h3>Tools relevant to this task</h3><p class="tiny muted">Related tools are not blanket permissions. Check each tool's data restrictions.</p>${tools.length?tools.map(x=>`<div class="item-card" style="margin-top:9px"><b>${e(x.title)}</b><p>${e(x.summary)}</p><span class="badge blue">${e(x.toolStatus)}</span><div style="margin-top:9px"><button class="btn sm" onclick="showPublicDetail('tools','${x.id}')">Tool details →</button></div></div>`).join(''):'<p class="small muted">No specific tool is associated with this answer.</p>'}</div><div class="card pad" style="box-shadow:none"><h3>Learn more</h3>${trainings.length?trainings.map(x=>`<div class="item-card"><b>${e(x.live.title)}</b><div class="tiny muted">${e(x.live.format)} · ${e(x.live.duration)}</div></div>`).join(''):'<p class="small muted">No targeted training is linked yet.</p>'}${nextEvent?`<div class="item-card"><b>${e(nextEvent.live.title)}</b><div class="tiny muted">${niceDate(nextEvent.live.date)} · ${e(nextEvent.live.time)}</div></div>`:''}<button class="btn sm" style="margin-top:10px" onclick="publicTab='training';render()">All learning →</button></div><div class="card pad" style="box-shadow:none"><h3>Need something else?</h3><div class="stack"><button class="btn sm" onclick="openRequest('Question')">Ask a specific question</button><button class="btn sm" onclick="openRequest('Report a conflict')">Flag conflicting advice</button></div></div></aside></div>`}
function toolsPublic(){let entries=db.tools.filter(x=>x.live).map(x=>({...x.live,id:x.id}));return `<div class="eyebrow">TOOL LIBRARY</div><h2>Explore AI tools</h2><p class="muted">Status, availability and data conditions are separate. These are made-up example services.</p><div class="toolbar"><label class="search"><span>⌕</span><input id="toolSearch" placeholder="Search tools and capabilities..." oninput="filterPublicTools()"></label><select class="select" id="toolContext" onchange="filterPublicTools()"><option value="all">All audiences</option>${CONTEXTS.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="publicTools" class="small-tiles">${entries.map(x=>toolTile(x)).join('')}</div>`}
function toolTile(x){return `<article class="item-card"><span class="badge blue">${e(x.toolStatus)}</span><h3 style="margin:12px 0 6px">${e(x.title)}</h3><p>${e(x.summary)}</p><div class="tiny muted">${e(x.cost)} · ${e((x.contexts||[]).join(', '))}</div><div style="margin-top:14px"><button class="btn sm" onclick="showPublicDetail('tools','${x.id}')">Access & conditions →</button></div></article>`}
function filterPublicTools(){const s=(document.getElementById('toolSearch')?.value||'').toLowerCase(),ctx=document.getElementById('toolContext')?.value||'all';const entries=db.tools.filter(x=>x.live).map(x=>({...x.live,id:x.id})).filter(x=>(x.title+' '+x.summary+' '+(x.capabilities||[]).join(' ')).toLowerCase().includes(s)&&(ctx==='all'||x.contexts?.includes(ctx)));document.getElementById('publicTools').innerHTML=entries.length?entries.map(toolTile).join(''):'<div class="empty">No published tools match this search.</div>'}
function eventsPublic(){return `<div class="eyebrow">SHARED CALENDAR</div><h2>What's happening around AI</h2><p class="muted">Filter by event type and audience. The calendar reads the same approved event records managed in Studio.</p><div class="toolbar"><select class="select" onchange="filters.eventType=this.value;render()"><option value="all">All event types</option>${EVENT_TYPES.map(x=>`<option value="${x}" ${filters.eventType===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="filters.audience=this.value;render()"><option value="all">All audiences</option>${CONTEXTS.map(x=>`<option value="${x}" ${filters.audience===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn sm" onclick="calendarDate=new Date();render()">This month</button></div>${calendar('public')}`}
function trainingPublic(){const entries=db.training.filter(x=>x.live);return `<div class="eyebrow">LEARN AND PRACTICE</div><h2>Training and practical resources</h2><p class="muted">Evergreen courses, recordings and guides can be curated independently of scheduled events.</p><div class="small-tiles">${entries.map(x=>`<article class="item-card"><span class="badge blue">${e(x.live.format)}</span><h3 style="margin:12px 0 6px">${e(x.live.title)}</h3><p>${e(x.live.summary)}</p><div class="small muted">${e(x.live.duration)} · ${e(x.live.contexts.join(', '))}</div><div style="margin-top:13px"><button class="btn sm" onclick="showPublicDetail('training','${x.id}')">View resource →</button></div></article>`).join('')}</div>`}
function communitiesPublic(){const entries=db.communities.filter(x=>x.live);return `<div class="eyebrow">COMMUNITIES AND COUNCILS</div><h2>Connect with people working on AI</h2><p class="muted">Groups maintain a stable record, while their events are published separately to the calendar.</p><div class="small-tiles">${entries.map(x=>`<article class="item-card"><h3>${e(x.live.title)}</h3><p>${e(x.live.summary)}</p><p class="tiny muted">${e(x.live.membership)} · ${e(x.live.meeting)}</p><button class="btn sm" onclick="showPublicDetail('communities','${x.id}')">Explore community →</button></article>`).join('')}</div>`}
function newsPublic(){const entries=db.news.filter(x=>x.live).sort((a,b)=>(b.live.date||'').localeCompare(a.live.date||''));return `<div class="eyebrow">NEWS AND UPDATES</div><h2>What's new</h2><p class="muted">Announcements are time-sensitive. Lasting rules and instructions should live in their own maintained records.</p><div class="stack">${entries.map(x=>`<article class="item-card"><div class="eyebrow">${niceDate(x.live.date)}</div><h3>${e(x.live.title)}</h3><p>${e(x.live.summary)}</p><button class="btn sm" onclick="showPublicDetail('news','${x.id}')">Read more →</button></article>`).join('')}</div>`}
function showPublicDetail(type,id){const r=db[type].find(x=>x.id===id);if(!r?.live)return toast('This record is not published.');const x=r.live;const pairs=type==='tools'?[['Status',x.toolStatus],['Cost',x.cost],['How to access',x.access],['Allowed information',x.dataUse],['Restrictions',x.restrictions],['Owner',x.owner]]:type==='events'?[['Date',niceDate(x.date)],['Time',x.time],['Duration',x.duration],['Location',x.location],['Audience',(x.contexts||[]).join(', ')]]:type==='training'?[['Format',x.format],['Duration',x.duration],['Audience',(x.contexts||[]).join(', ')]]:type==='communities'?[['Membership',x.membership],['Meets',x.meeting]]:[['Date',x.date?niceDate(x.date):''],['Audience',(x.contexts||[]).join(', ')]];document.getElementById('modalContent').innerHTML=`<div class="eyebrow">${e(displayType(type))} · PUBLISHED · ${e(id)}</div><h2>${e(x.title)}</h2><p class="muted">${e(x.summary||'')}</p><div class="stack" style="margin:18px 0">${pairs.filter(y=>y[1]).map(([a,b])=>`<div><div class="small strong">${e(a)}</div><div class="small muted">${e(b)}</div></div>`).join('')}</div>${x.url?`<p class="small muted">Demo destination: <code>${e(x.url)}</code><br>This fictional URL is not a live service.</p>`:''}<div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openRequest('Question')">Ask about this →</button></div>`;document.getElementById('modalLayer').classList.add('open')}
function openRequest(type){requestType=type;document.getElementById('modalContent').innerHTML=`<div class="eyebrow">LUKEU SUPPORT · DEMO REQUEST</div><h2>${e(type)}</h2><p class="muted small">Submit a question, correction or report. This creates a local Studio inbox record only; it is not sent to anyone.</p><form id="requestForm" onsubmit="event.preventDefault();submitRequest()"><div class="field"><label for="reqSubject">What do you need help with? *</label><input id="reqSubject" name="subject" required maxlength="150" placeholder="Can I use AI to...?"></div><div class="field"><label for="reqDetails">Tell us more *</label><textarea id="reqDetails" name="details" required placeholder="Describe your task, concern or the guidance that seems inconsistent."></textarea></div><div class="field"><label>Context</label><select name="context">${CONTEXTS.map(x=>`<option ${publicState.contexts.includes(x)?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Add to demo inbox →</button></div></form>`;document.getElementById('modalLayer').classList.add('open')}
function submitRequest(){const form=document.getElementById('requestForm');if(!form?.reportValidity())return;const f=new FormData(form);const r={id:`REQ-${String(db.requests.length+1).padStart(3,'0')}`,type:requestType,subject:f.get('subject').trim(),details:f.get('details').trim(),context:f.get('context'),date:new Date().toLocaleDateString('en-CA'),status:'new'};db.requests.unshift(r);log('Submitted user request',r.id);persist();closeModal();toast('Added to the local Studio inbox. No request has been sent.');render()}
function closeModal(){document.getElementById('modalLayer').classList.remove('open')}
document.addEventListener('keydown',evt=>{if(evt.key==='Escape'){closeEditor();closeModal()}});
window.addEventListener('storage',evt=>{if(evt.key===STORAGE_KEY){db=loadDB();render()}});
render();
</script>
</body>
</html>
